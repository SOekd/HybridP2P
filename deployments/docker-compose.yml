# Benchmark: 8 seeder containers, each with its own port and data volume.
#
# Setup:
#   1. Place compiled Linux binary at ./deployments/p2pcdn-daemon
#   2. Place files to seed in ./deployments/seed/
#   3. Copy .env.benchmark to .env.benchmark and fill in values
#   4. docker compose -f deployments/docker-compose.yml up -d
#
# Attach to REPL:
#   docker attach p2pcdn-seeder-1   (Ctrl+P, Ctrl+Q to detach)
#
# Uses host networking: no NAT, no port mapping confusion.
# Each seeder binds directly to its port on the host network.
# Data dirs use bind mounts so peer keys persist across restarts.

x-seeder: &seeder
  image: debian:bookworm-slim
  network_mode: host
  stdin_open: true
  tty: true
  env_file:
    - .env.benchmark
  environment:
    TERM: xterm-256color
  volumes:
    - ./p2pcdn-daemon:/app/p2pcdn-daemon:ro
    - ./seed:/app/seed:ro
    - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
  working_dir: /app
  command: ["sh", "-c", "apt-get update -qq && apt-get install -y -qq ca-certificates > /dev/null 2>&1; stty erase '^H' 2>/dev/null; exec ./p2pcdn-daemon"]
  restart: unless-stopped

services:
  seeder1:
    <<: *seeder
    container_name: p2pcdn-seeder-1
    environment:
      P2PCDN_CLIENT_LISTEN_PORT: "50001"
      P2PCDN_DAEMON_ADDR: "0.0.0.0:9091"
      P2PCDN_CLIENT_DATA_DIR: /app/data/seeder1
      P2PCDN_LOGGING_FILE: /app/data/seeder1/daemon.log
    volumes:
      - ./p2pcdn-daemon:/app/p2pcdn-daemon:ro
      - ./seed:/app/seed:ro
      - ./data/seeder1:/app/data/seeder1

  seeder2:
